<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人名片 · 极简卡片</title>
  <!-- 引入 Google Fonts 提升字体质感 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <!-- Font Awesome 图标库 (免费版本) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 1.5rem;
      margin: 0;
    }

    /* 名片卡片主体 */
    .business-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      width: 100%;
      max-width: 800px;
      border-radius: 2.5rem;
      box-shadow: 
        0 30px 50px -20px rgba(0, 20, 40, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.7) inset,
        0 0 0 1px rgba(0, 0, 0, 0.02);
      padding: 2.5rem;
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .business-card:hover {
      box-shadow: 
        0 40px 60px -24px rgba(0, 20, 40, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.9) inset;
      transform: scale(1.005);
    }

    /* 布局：左右两栏 (左侧头像区，右侧信息区) */
    .card-content {
      display: flex;
      flex-wrap: wrap;
      gap: 2.2rem;
      align-items: center;
    }

    /* 左侧：头像 + 姓名 + 职位 */
    .profile-section {
      flex: 1 1 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-right: 1rem;
      border-right: 1px solid rgba(0, 0, 0, 0.06);
    }

    .avatar-frame {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2b5876, #4e4376);
      padding: 5px;
      margin-bottom: 1.3rem;
      box-shadow: 0 15px 25px -8px rgba(43, 88, 118, 0.4);
      transition: transform 0.2s;
    }

    .avatar-frame:hover {
      transform: scale(1.02);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.2rem;
      font-weight: 600;
      color: #2b5876;
      background: #f0f6ff;
      border: 3px solid white;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      text-transform: uppercase;
    }

    /* 或者用图片头像 (这里用纯CSS首字母展示，保留可替换性) */
    .name {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1a2e3b;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    .badge {
      background: #e3eef9;
      color: #1f4b6e;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 1rem;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      letter-spacing: 0.3px;
      border: 1px solid rgba(43, 88, 118, 0.1);
      margin-top: 0.25rem;
    }

    .badge i {
      font-size: 0.75rem;
      color: #2b5876;
    }

    /* 右侧：详细信息 */
    .info-section {
      flex: 2 1 380px;
      display: flex;
      flex-direction: column;
      gap: 1.3rem;
    }

    .headline {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0c2b3c;
      line-height: 1.3;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-left: 5px solid #2b5876;
      padding-left: 1rem;
    }

    .headline i {
      color: #2b5876;
      font-size: 1.4rem;
    }

    .bio {
      color: #3e5a6b;
      font-size: 1rem;
      line-height: 1.6;
      font-weight: 400;
      background: rgba(245, 249, 255, 0.6);
      padding: 1rem 1.2rem;
      border-radius: 1.4rem;
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
    }

    /* 联系方式网格 */
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin: 0.2rem 0 0.3rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
      color: #1d3d51;
      background: white;
      padding: 0.7rem 1rem;
      border-radius: 2rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
      border: 1px solid #e7eef5;
      transition: all 0.15s;
      font-weight: 500;
      word-break: break-word;
    }

    .contact-item:hover {
      background: #f3faff;
      border-color: #bcd4e9;
      transform: translateY(-2px);
      box-shadow: 0 10px 18px -8px rgba(43, 88, 118, 0.2);
    }

    .contact-item i {
      width: 1.4rem;
      font-size: 1.1rem;
      color: #2b5876;
      text-align: center;
    }

    /* 技能标签 */
    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }

    .skill-tag {
      background: #d9e9f7;
      color: #15435c;
      padding: 0.35rem 1rem;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.2px;
      border: 1px solid rgba(43, 88, 118, 0.12);
      transition: background 0.2s;
    }

    .skill-tag:hover {
      background: #c2ddf2;
    }

    /* 社交图标区 */
    .social-links {
      display: flex;
      gap: 0.8rem;
      margin-top: 0.4rem;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      background: white;
      color: #2b5876;
      font-size: 1.1rem;
      transition: all 0.2s;
      text-decoration: none;
      border: 1px solid #dae6f2;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.02);
    }

    .social-link:hover {
      background: #2b5876;
      color: white;
      border-color: #2b5876;
      transform: translateY(-3px);
      box-shadow: 0 12px 15px -8px rgba(43, 88, 118, 0.4);
    }

    /* 分隔线 */
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, #cbdae6, transparent);
      margin: 0.6rem 0 0.4rem;
    }

    /* 响应式 */
    @media (max-width: 620px) {
      .business-card {
        padding: 1.8rem;
        border-radius: 2rem;
      }

      .card-content {
        gap: 1.5rem;
      }

      .profile-section {
        border-right: none;
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        padding-right: 0;
        padding-bottom: 1.5rem;
        width: 100%;
      }

      .avatar-frame {
        width: 120px;
        height: 120px;
      }

      .avatar {
        font-size: 3.5rem;
      }

      .name {
        font-size: 1.7rem;
      }

      .headline {
        font-size: 1.3rem;
      }

      .contact-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 400px) {
      .business-card {
        padding: 1.5rem;
      }

      .bio {
        font-size: 0.95rem;
      }
    }

    /* 为图片头像保留可替换的样式 (注释说明) */
    /* 如果你有真实头像图片，可以用 .avatar img 并调整 */
  </style>
</head>
<body>
  <div class="business-card">
    <div class="card-content">
      <!-- 左侧头像区 -->
      <div class="profile-section">
        <div class="avatar-frame">
          <!-- 使用首字母 / 可替换为 <img src="头像.jpg" alt="avatar" class="avatar"> -->
          <div class="avatar">陈</div>
        </div>
        <div class="name">陈 一 鸣</div>
        <div class="badge">
          <i class="fas fa-briefcase"></i> 产品设计师 · 全栈开发
        </div>
      </div>

      <!-- 右侧信息区 -->
      <div class="info-section">
        <div class="headline">
          <i class="fas fa-quote-left"></i> 设计驱动 · 代码实现
        </div>
        <p class="bio">
          拥有 6 年互联网产品经验，擅长将复杂需求转化为优雅简洁的界面。热爱前端工程与交互设计，相信好的产品是艺术与技术的结合。
        </p>

        <!-- 联系方式 -->
        <div class="contact-grid">
          <div class="contact-item">
            <i class="fas fa-envelope"></i>
            <span>yiming.chen@example.com</span>
          </div>
          <div class="contact-item">
            <i class="fas fa-phone-alt"></i>
            <span>+86 138 0000 1234</span>
          </div>
          <div class="contact-item">
            <i class="fas fa-map-marker-alt"></i>
            <span>中国 · 上海</span>
          </div>
          <div class="contact-item">
            <i class="fas fa-globe"></i>
            <span>yiming.design</span>
          </div>
        </div>

        <!-- 技能标签 -->
        <div class="skill-tags">
          <span class="skill-tag">UI/UX</span>
          <span class="skill-tag">React</span>
          <span class="skill-tag">TypeScript</span>
          <span class="skill-tag">Figma</span>
          <span class="skill-tag">Node.js</span>
          <span class="skill-tag">产品策略</span>
        </div>

        <div class="divider"></div>

        <!-- 社交链接 -->
        <div class="social-links">
          <a href="#" class="social-link" aria-label="GitHub"><i class="fab fa-github"></i></a>
          <a href="#" class="social-link" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
          <a href="#" class="social-link" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
          <a href="#" class="social-link" aria-label="Dribbble"><i class="fab fa-dribbble"></i></a>
          <a href="#" class="social-link" aria-label="个人博客"><i class="fas fa-pen-fancy"></i></a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
