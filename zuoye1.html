<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图书馆读者调查问卷</title>
    <style>
        body {
            font-family: "宋体", sans-serif;
            font-size: 14px;
            color: #000;
            background-color: #fff;
            margin: 0;
            padding: 20px;
            font-weight: bold; /* 全局字体加粗 */
        }

        /* 最外层粗粉色边框容器 */
        .form-wrapper {
            width: 750px;
            margin: 0 auto;
            border: 8px solid #f19eca; 
            padding: 2px; 
            box-sizing: border-box;
            background-color: #fff;
        }

        /* 内部每个区块：细粉边框 */
        .block {
            border: 1px solid #f19eca; 
            margin-bottom: 2px; 
            padding: 8px 15px;  
            background-color: #fff;
        }

        .block:last-child {
            margin-bottom: 0;
        }

        /* 标题区域居中 */
        .header-block {
            text-align: center;
            padding: 15px 10px;
        }

        h2 {
            font-size: 22px; 
            margin: 0;
            letter-spacing: 2px;
            font-weight: 900; 
        }

        /* 说明文字 */
        .intro-block {
            line-height: 1.6;
            padding: 10px 15px;
        }
        
        .intro-block p {
            margin: 0;
            text-indent: 2em;
        }

        /* 题目文字 */
        .q-title {
            display: block; 
            padding: 2px 0; 
            margin-bottom: 5px;
            font-weight: bold;
            color: #000000;
        }

        /* 输入框 */
        select, input[type="text"] {
            padding: 2px;
            border: 1px solid #999; 
            vertical-align: middle; 
            font-weight: bold; 
        }

        /* 单独让第1题的下拉选项和文字变细 */
        .thin-text, select.thin-text {
            font-weight: normal !important;
        }

        .inline-input {
            width: 150px;
            margin-left: 5px;
        }

        .long-input {
            width: 400px;
            display: block;
            margin-top: 5px;
        }

        /* 选项行 */
        .option-line {
            margin-bottom: 5px;
            display: block;
        }

        input[type="radio"], input[type="checkbox"] {
            vertical-align: middle;
            margin-right: 5px;
            margin-top: 0;
        }

        label {
            cursor: pointer;
            vertical-align: middle;
            font-weight: bold; 
        }

        /* 文本域 */
        textarea {
            width: 100%;
            height: 70px;
            margin-top: 5px;
            padding: 5px;
            box-sizing: border-box;
            border: 1px solid #999;
            resize: vertical;
            font-family: inherit;
            font-weight: bold; 
        }

        /* 底部按钮区域 */
        .btn-block {
            text-align: center;
            padding: 10px;
        }

        button {
            padding: 3px 15px;
            font-size: 14px;
            margin: 0 10px;
            cursor: pointer;
            background-color: #f4f4f4;
            border: 1px solid #999; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

<div class="form-wrapper">
    
    <!-- 标题区 -->
    <div class="block header-block">
        <h2>图书馆读者调查问卷</h2>
    </div>

    <!-- 说明文字区 -->
    <div class="block intro-block">
        <p>为了能够及时了解您对图书馆的需求，提升我校图书馆文献资源建设的质量和水平，更好的为我校教学科研服务，我馆特设计了问卷调查题目如下，请协助填写，谢谢您的合作！</p>
    </div>

    <form action="#" method="post">
        
        <!-- 第1题 (去除下拉框和提示文字的加粗) -->
        <div class="block">
            <span class="q-title">1. 您的年级</span>
            <!-- 给下面的文字和下拉框加上 thin-text 类 -->
            <span class="thin-text">请你选择：</span>
            <select name="grade" class="thin-text">
                <option value="">请你选择</option>
                <option value="大一">大一</option>
                <option value="大二">大二</option>
                <option value="大三">大三</option>
                <option value="大四">大四</option>
            </select>
        </div>

        <!-- 第2题 -->
        <div class="block">
            <span class="q-title">2. 您的专业</span>
            <input type="text" name="major" class="long-input">
        </div>

        <!-- 第3题 -->
        <div class="block">
            <span class="q-title">3. 对于图书馆的阅览环境</span>
            <div class="option-line">
                <label><input type="radio" name="environment" value="满意"> 满意</label>
            </div>
            <div class="option-line">
                <label><input type="radio" name="environment" value="基本满意"> 基本满意</label>
            </div>
            <div class="option-line">
                <label><input type="radio" name="environment" value="不满意"> 不满意</label>
                您的建议：<input type="text" name="env_suggestion" class="inline-input">
            </div>
        </div>

        <!-- 第4题 -->
        <div class="block">
            <span class="q-title">4. 您到图书馆的原因是（可多选）：</span>
            <div class="option-line"><label><input type="checkbox" name="reason" value="借阅专业图书"> 借阅专业图书</label></div>
            <div class="option-line"><label><input type="checkbox" name="reason" value="随便坐坐，翻翻书刊"> 随便坐坐，翻翻书刊</label></div>
            <div class="option-line"><label><input type="checkbox" name="reason" value="借阅光盘"> 借阅光盘</label></div>
            <div class="option-line"><label><input type="checkbox" name="reason" value="参加图书馆组织的活动"> 参加图书馆组织的活动</label></div>
            <div class="option-line"><label><input type="checkbox" name="reason" value="自习，复习功课"> 自习，复习功课</label></div>
            <div class="option-line"><label><input type="checkbox" name="reason" value="上网"> 上网</label></div>
            <div class="option-line"><label><input type="checkbox" name="reason" value="检索电子文献"> 检索电子文献</label></div>
        </div>

        <!-- 第5题 -->
        <div class="block">
            <span class="q-title">5. 您到图书馆的频率</span>
            <div class="option-line"><label><input type="radio" name="frequency" value="几乎每天"> 几乎每天</label></div>
            <div class="option-line"><label><input type="radio" name="frequency" value="每周1-2次"> 每周1-2次</label></div>
            <div class="option-line"><label><input type="radio" name="frequency" value="每月1-2次"> 每月1-2次</label></div>
            <div class="option-line"><label><input type="radio" name="frequency" value="几乎不去"> 几乎不去</label></div>
        </div>

        <!-- 第6题 -->
        <div class="block">
            <span class="q-title">6. 您对学校的建议</span>
            <div>请您提出宝贵建议：</div>
            <textarea name="school_suggestion"></textarea>
        </div>

        <!-- 底部按钮区 -->
        <div class="block btn-block">
            <button type="submit">提交答案</button>
            <button type="reset">清 空</button>
        </div>
        
    </form>
</div>

</body>
</html>
